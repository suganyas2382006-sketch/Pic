<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Structure Reveal</title>
  <style>
    body { 
      margin: 0; 
      background: #000000; /* Pure black for better contrast */
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let particlesArray = [];
    
    const image = new Image();
    image.src = '2317.png'; 

    image.addEventListener('load', function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const scale = Math.min(canvas.width / image.width, canvas.height / image.height) * 0.8;
      const drawWidth = Math.floor(image.width * scale);
      const drawHeight = Math.floor(image.height * scale);
      const offsetX = (canvas.width - drawWidth) / 2;
      const offsetY = (canvas.height - drawHeight) / 2;

      const hiddenCanvas = document.createElement('canvas');
      const hiddenCtx = hiddenCanvas.getContext('2d');
      hiddenCanvas.width = drawWidth;
      hiddenCanvas.height = drawHeight;
      hiddenCtx.drawImage(image, 0, 0, drawWidth, drawHeight);
      
      const pixels = hiddenCtx.getImageData(0, 0, drawWidth, drawHeight).data;
      
      const neonColors = ['#ff0055', '#00eeff', '#ffaa00', '#bd00ff', '#00ff88'];

      class Particle {
        constructor(x, y, color) {
          // Start exactly where they belong to avoid the explosion effect
          this.x = x + offsetX;
          this.y = y + offsetY;
          this.baseX = this.x;
          this.baseY = this.y;
          this.color = color;
          this.size = Math.random() * 1.5 + 0.5; 
          
          // Variables for a gentle twinkling float instead of flying
          this.angle = Math.random() * Math.PI * 2;
          this.speed = Math.random() * 0.05 + 0.02;
        }
        
        update() {
          // Subtle floating movement in place
          this.x = this.baseX + Math.cos(this.angle) * 1.2;
          this.y = this.baseY + Math.sin(this.angle) * 1.2;
          this.angle += this.speed;
        }
        
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          ctx.fill();
        }
      }

      const gap = 3; 
      const edgeThreshold = 30; // Increased to ignore slight photo variations
      const minBrightness = 40; // STRICTLY ignores background compression noise

      for (let y = 0; y < drawHeight - gap; y += gap) {
        for (let x = 0; x < drawWidth - gap; x += gap) {
          const i = (y * drawWidth + x) * 4;
          const rightI = (y * drawWidth + (x + gap)) * 4;
          const bottomI = ((y + gap) * drawWidth + x) * 4;

          const alpha = pixels[i + 3];
          const b1 = (pixels[i] + pixels[i+1] + pixels[i+2]) / 3;
          
          // If the pixel is dark, kill it immediately. No background noise allowed.
          if (alpha < 50 || b1 < minBrightness) continue; 

          const b2 = (pixels[rightI] + pixels[rightI+1] + pixels[rightI+2]) / 3;
          const b3 = (pixels[bottomI] + pixels[bottomI+1] + pixels[bottomI+2]) / 3;

          // Edge detection
          if (Math.abs(b1 - b2) > edgeThreshold || Math.abs(b1 - b3) > edgeThreshold) {
            const randomNeon = neonColors[Math.floor(Math.random() * neonColors.length)];
            particlesArray.push(new Particle(x, y, randomNeon));
          }
        }
      }

      function animate() {
        ctx.shadowBlur = 0; 
        ctx.globalCompositeOperation = 'source-over';
        // Darker clear rectangle to eliminate the long laser trails
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.globalCompositeOperation = 'lighter';

        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
        }
        
        requestAnimationFrame(animate);
      }
      
      animate();
    });
  </script>
</body>
</html>
