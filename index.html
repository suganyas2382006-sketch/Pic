<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Prince</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap');

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #110008, #050002);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Ambient Background Particles */
    .sparkle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #ff4d6d;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px rgba(255, 77, 109, 0.5);
      animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.1; transform: scale(1); }
      100% { opacity: 1; transform: scale(2); }
    }

    .container {
      position: relative;
      perspective: 1200px;
      margin-top: 120px;
    }

    .envelope {
      position: relative;
      width: 340px;
      height: 230px;
      background: #1a0b12;
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 0 1px #ff4d6d;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .envelope:hover {
      transform: translateY(-12px) scale(1.02);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-top: 130px solid #2d1320;
      transform-origin: top;
      transition: transform 0.8s 0.2s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s;
      z-index: 4;
    }

    .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid #240e19;
      border-right: 170px solid #240e19;
      border-bottom: 130px solid #1f0b15;
      z-index: 3;
      pointer-events: none;
      border-radius: 0 0 6px 6px;
    }

    .letter {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      height: 200px;
      background: #12050a;
      border-radius: 8px;
      z-index: 2;
      transition: height 1.2s 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                  bottom 1.2s 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                  z-index 0.1s 0.8s;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
      border: 1px solid #ff4d6d;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
      transition: transform 0.8s, z-index 0s 0.4s;
    }

    .envelope.open .letter {
      bottom: 110px;
      height: 600px;
      z-index: 5;
    }

    .content {
      opacity: 0;
      transition: opacity 1.5s 1.8s ease-in;
      text-align: center;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .envelope.open .content {
      opacity: 1;
    }

    .greeting {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      color: #ffb3c1;
      margin: 0 0 10px 0;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }

    .animated-heart {
      display: inline-block;
      width: 18px;
      height: 18px;
      background-color: #ff4d6d;
      transform: rotate(45deg);
      animation: heartbeat 1.5s infinite;
      box-shadow: 0 0 10px #ff4d6d;
      margin: 0 5px;
    }
    .animated-heart::before, .animated-heart::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #ff4d6d;
      border-radius: 50%;
    }
    .animated-heart::before { top: -9px; left: 0; }
    .animated-heart::after { top: 0; left: -9px; }

    @keyframes heartbeat {
      0% { transform: rotate(45deg) scale(0.8); }
      14% { transform: rotate(45deg) scale(1.1); }
      28% { transform: rotate(45deg) scale(0.8); }
      42% { transform: rotate(45deg) scale(1.1); }
      70% { transform: rotate(45deg) scale(0.8); }
    }

    .message {
      font-size: 14px;
      color: #ffccd5;
      line-height: 1.9;
      margin: 0 0 25px 0;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .photo-frame {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #ff4d6d;
      margin: 0 auto;
      box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .timer-container {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 77, 109, 0.3);
    }

    .timer-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #ffb3c1;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .timer-display {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: #fff;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .click-instruction {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff4d6d;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 3px;
      pointer-events: none;
      animation: pulse-text 2s infinite;
    }

    @keyframes pulse-text {
      0% { opacity: 0.4; }
      50% { opacity: 1; text-shadow: 0 0 10px #ff4d6d; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <script>
    for(let i=0; i<40; i++) {
      let sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.top = Math.random() * 100 + 'vh';
      sparkle.style.left = Math.random() * 100 + 'vw';
      sparkle.style.animationDelay = (Math.random() * 4) + 's';
      document.body.appendChild(sparkle);
    }
  </script>

  <div class="container">
    <div class="envelope" onclick="this.classList.add('open')">
      <div class="flap"></div>
      <div class="pocket"></div>
      
      <div class="letter">
        <div class="content">
          <div>
            <h1 class="greeting">Hey my prince <div class="animated-heart"></div></h1>
            
            <p class="message">
              Suddenly, I remembered us in that park…<br>
              the hugs, the kisses, the moments we shared.<br>
              And somehow, that little memory<br>
              still makes my heart smile,<br>
              like a beautiful moment I never want to forget. <div class="animated-heart" style="transform: scale(0.6) rotate(45deg);"></div>
            </p>

            <div class="photo-frame">
              <!-- DELETE THIS TEXT AND PASTE YOUR BASE64 STRING BETWEEN THE QUOTES -->
              <img src="PASTE_HERE" alt="Us">
            </div>
          </div>

          <div class="timer-container">
            <div class="timer-label">Together Since ✦ Feb 18, 2025</div>
            <div class="timer-display" id="timer">Calculating...</div>
          </div>
        </div>
      </div>
      <div class="click-instruction">Touch To Open</div>
    </div>
  </div>

  <script>
    const startDate = new Date("2025-02-18T00:00:00").getTime();

    setInterval(() => {
      const now = new Date().getTime();
      const difference = now - startDate;

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('timer').innerText = 
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
  </script>
</body>
</html>
