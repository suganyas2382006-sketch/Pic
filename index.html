<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Prince</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap');

    :root {
      --black: #050000;
      --dark-bg: #140205;
      --wine-deep: #2b040a;
      --wine-medium: #4a0a18;
      --wine-bright: #8a1329;
      --wine-glow: #b81d3b;
      --text-main: #f2d5db;
      --text-muted: #d9aab3;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, var(--dark-bg), var(--black));
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden; 
    }

    .bg-heart {
      position: absolute;
      background-color: var(--wine-glow);
      transform: rotate(45deg);
      animation: floatHeart linear infinite;
      opacity: 0;
      z-index: 0;
      box-shadow: 0 0 15px rgba(184, 29, 59, 0.4);
    }
    
    .bg-heart::before, .bg-heart::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: var(--wine-glow);
      border-radius: 50%;
    }
    
    .bg-heart::before { top: -50%; left: 0; }
    .bg-heart::after { top: 0; left: -50%; }

    @keyframes floatHeart {
      0% { transform: translateY(100vh) rotate(45deg) scale(0.3); opacity: 0; }
      20% { opacity: 0.15; }
      80% { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(45deg) scale(1.2); opacity: 0; }
    }

    .container {
      position: relative;
      perspective: 1200px;
      margin-top: 5vh; 
      z-index: 10;
    }

    .envelope {
      position: relative;
      width: 320px; 
      height: 220px;
      background: var(--wine-medium);
      border-radius: 6px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 0 0 1px var(--wine-bright);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .envelope:hover {
      transform: translateY(-5px) scale(1.01);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 125px solid var(--wine-deep);
      transform-origin: top;
      z-index: 4;
      transition: transform 0.6s 1.1s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 1.1s; 
    }

    .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid #3d0813;
      border-right: 160px solid #3d0813;
      border-bottom: 120px solid #33050f;
      z-index: 3;
      pointer-events: none;
      border-radius: 0 0 6px 6px;
    }

    .letter {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 200px;
      background: #0a0103;
      border-radius: 8px;
      z-index: 2;
      box-shadow: 0 5px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px 35px 15px;
      box-sizing: border-box;
      border: 1px solid var(--wine-glow);
      overflow-y: auto; 
      overflow-x: hidden;
      transition: height 0.8s 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  bottom 0.8s 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  z-index 0s 0.3s;
    }

    .letter::-webkit-scrollbar {
      width: 4px;
    }
    .letter::-webkit-scrollbar-track {
      background: transparent;
    }
    .letter::-webkit-scrollbar-thumb {
      background: var(--wine-glow);
      border-radius: 10px;
    }

    .content {
      opacity: 0;
      text-align: center;
      width: 100%;
      height: auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; 
      align-items: center;
      gap: 15px;
      transition: opacity 0.3s ease-out;
    }

    .envelope.open {
      transform: translateY(12vh); 
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
    }

    .envelope.open .letter {
      bottom: 70px;
      height: 65vh; 
      max-height: 520px; 
      z-index: 5;
      transition: height 1s 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                  bottom 1s 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                  z-index 0s 0.6s;
    }

    .envelope.open .content {
      opacity: 1;
      transition: opacity 1s 1.6s ease-in;
    }

    .greeting {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(32px, 8vw, 38px);
      color: var(--wine-glow);
      margin: 0;
      text-shadow: 0 0 15px rgba(184, 29, 59, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .message {
      font-size: clamp(12px, 3.5vw, 14px);
      color: var(--text-main);
      line-height: 1.7;
      margin: 0;
      font-style: italic;
      letter-spacing: 0.5px;
      padding: 0 5px;
    }

    .animated-heart {
      display: inline-block;
      width: 14px;
      height: 14px;
      background-color: var(--wine-glow);
      transform: rotate(45deg);
      animation: heartbeat 1.5s infinite;
      box-shadow: 0 0 10px var(--wine-glow);
      position: relative;
      top: -2px;
    }
    .animated-heart::before, .animated-heart::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: var(--wine-glow);
      border-radius: 50%;
    }
    .animated-heart::before { top: -7px; left: 0; }
    .animated-heart::after { top: 0; left: -7px; }

    @keyframes heartbeat {
      0% { transform: rotate(45deg) scale(0.8); }
      14% { transform: rotate(45deg) scale(1.1); }
      28% { transform: rotate(45deg) scale(0.8); }
      42% { transform: rotate(45deg) scale(1.1); }
      70% { transform: rotate(45deg) scale(0.8); }
    }

    .photo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 5px 0;
    }

    .photo-frame {
      display: inline-block; 
      border: 3px solid var(--wine-glow);
      border-radius: 6px; 
      box-shadow: 0 0 25px rgba(184, 29, 59, 0.5);
      background-color: var(--black);
      padding: 0;
      font-size: 0; 
      overflow: hidden;
      max-width: 95%; 
    }

    .photo-frame img {
      display: block;
      max-width: 100%;  
      max-height: 180px; 
      width: auto;
      height: auto;
    }

    .timer-container {
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid rgba(184, 29, 59, 0.4);
      width: 100%;
    }

    .timer-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(9px, 2.5vw, 11px);
      letter-spacing: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .timer-display {
      font-family: 'Cinzel', serif;
      font-size: clamp(14px, 4vw, 18px);
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4), 0 0 15px var(--wine-glow);
    }

    .click-instruction {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--wine-glow);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 4px;
      pointer-events: none;
      animation: pulse-text 2s infinite;
      white-space: nowrap;
    }

    @keyframes pulse-text {
      0% { opacity: 0.3; }
      50% { opacity: 1; text-shadow: 0 0 15px var(--wine-glow); }
      100% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <script>
    for(let i=0; i<35; i++) {
      let heart = document.createElement('div');
      heart.className = 'bg-heart';
      
      let size = Math.random() * 8 + 6;
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heart.style.animationDuration = (Math.random() * 6 + 4) + 's';
      
      document.body.appendChild(heart);
    }
  </script>

  <div class="container">
    <div class="envelope" onclick="toggleLetter(this)">
      <div class="flap"></div>
      <div class="pocket"></div>
      
      <div class="letter">
        <div class="content">
          
          <h1 class="greeting">Hey my prince <div class="animated-heart"></div></h1>
          
          <p class="message">
            Suddenly, I remembered us in that park…<br>
            the hugs, the kisses, the moments we shared.<br>
            And somehow, that little memory<br>
            still makes my heart smile,<br>
            like a beautiful moment I never want to forget.
          </p>

          <div class="photo-container">
            <div class="photo-frame">
              <img src="image.jpg" alt="Us">
            </div>
          </div>

          <div class="timer-container">
            <div class="timer-label">Together Since ✦ Feb 18, 2025</div>
            <div class="timer-display" id="timer">Calculating...</div>
          </div>

        </div>
      </div>
      <div class="click-instruction" id="instruction-text">Touch To Open</div>
    </div>
  </div>

  <script>
    function toggleLetter(element) {
      element.classList.toggle('open');
      const instructionText = document.getElementById('instruction-text');
      
      if(element.classList.contains('open')) {
        instructionText.innerText = 'Touch To Close';
      } else {
        instructionText.innerText = 'Touch To Open';
      }
    }

    const startDate = new Date("2025-02-18T00:00:00").getTime();

    setInterval(() => {
      const now = new Date().getTime();
      const difference = now - startDate;

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('timer').innerText = 
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
  </script>
</body>
</html>
